<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attempt Test</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    rel="stylesheet"
  />
  <style>
    body {
      background: #f9fafc;
    }
    .timer {
      font-size: 1.2rem;
      font-weight: bold;
    }
    .question-card {
      border-left: 5px solid #007bff;
      transition: all 0.3s ease;
    }
    .question-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="fw-semibold"><i class="fa-solid fa-clipboard-list me-2"></i>Online Quiz</h3>
      <div class="timer text-danger"><i class="fa-solid fa-clock me-1"></i> Time left: <span id="time">30</span>s</div>
    </div>

    <!-- Question Card -->
    <div class="card shadow-sm question-card">
      <div class="card-body">
        <h5 id="question-text">1. What does CPU stand for?</h5>
        <div class="mt-3">
          <div class="form-check">
            <input type="radio" name="option" class="form-check-input" id="a" />
            <label class="form-check-label" for="a">Central Processing Unit</label>
          </div>
          <div class="form-check">
            <input type="radio" name="option" class="form-check-input" id="b" />
            <label class="form-check-label" for="b">Central Program Unit</label>
          </div>
          <div class="form-check">
            <input type="radio" name="option" class="form-check-input" id="c" />
            <label class="form-check-label" for="c">Control Processing Unit</label>
          </div>
          <div class="form-check">
            <input type="radio" name="option" class="form-check-input" id="d" />
            <label class="form-check-label" for="d">Central Processor Utility</label>
          </div>
        </div>
        <div class="text-end mt-4">
          <button class="btn btn-primary" id="nextBtn">Save & Next</button>
        </div>
      </div>
    </div>

    <!-- Progress -->
    <div class="progress my-4" style="height: 20px;">
      <div
        class="progress-bar progress-bar-striped bg-success"
        role="progressbar"
        style="width: 20%"
        id="progressBar"
      >
        1 / 5
      </div>
    </div>
  </div>

  <!-- Result Modal -->
  <div
    class="modal fade"
    id="resultModal"
    tabindex="-1"
    aria-labelledby="resultModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title" id="resultModalLabel">
            <i class="fa-solid fa-trophy me-2"></i>Quiz Completed
          </h5>
        </div>
        <div class="modal-body text-center">
          <h4 class="mb-3">Your Result</h4>
          <p><strong>Correct Answers:</strong> <span id="correct">3</span></p>
          <p><strong>Total Questions:</strong> <span id="total">5</span></p>
          <p><strong>Score:</strong> <span id="score">60%</span></p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript (front-end only) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const questions = [
      {
        q: "What does CPU stand for?",
        options: [
          "Central Processing Unit",
          "Central Program Unit",
          "Control Processing Unit",
          "Central Processor Utility",
        ],
      },
      {
        q: "Which part of the computer performs calculations?",
        options: ["ALU", "Memory", "Control Unit", "Cache"],
      },
      {
        q: "RAM is a type of?",
        options: ["Storage", "Memory", "Input Device", "Processor"],
      },
      {
        q: "Which language is closest to hardware?",
        options: ["Assembly", "Python", "C#", "Java"],
      },
      {
        q: "What is the full form of HTML?",
        options: [
          "Hyper Trainer Markup Language",
          "Hyper Text Markup Language",
          "Hyper Text Machine Language",
          "Highlevel Text Machine Language",
        ],
      },
    ];

    let current = 0;
    let total = questions.length;
    let timer = 30;
    let interval;

    const qText = document.getElementById("question-text");
    const progressBar = document.getElementById("progressBar");
    const nextBtn = document.getElementById("nextBtn");
    const timeDisplay = document.getElementById("time");

    function loadQuestion() {
      const q = questions[current];
      qText.textContent = `${current + 1}. ${q.q}`;
      document.querySelectorAll(".form-check-label").forEach((lbl, i) => {
        lbl.textContent = q.options[i];
      });
      document.querySelectorAll(".form-check-input").forEach((input) => {
        input.checked = false;
      });
      updateProgress();
      resetTimer();
    }

    function updateProgress() {
      const percent = ((current + 1) / total) * 100;
      progressBar.style.width = percent + "%";
      progressBar.textContent = `${current + 1} / ${total}`;
    }

    function resetTimer() {
      clearInterval(interval);
      timer = 30;
      timeDisplay.textContent = timer;
      interval = setInterval(() => {
        timer--;
        timeDisplay.textContent = timer;
        if (timer <= 0) {
          nextQuestion();
        }
      }, 1000);
    }

    function nextQuestion() {
      current++;
      if (current < total) {
        loadQuestion();
      } else {
        clearInterval(interval);
        const modal = new bootstrap.Modal(document.getElementById("resultModal"));
        modal.show();
      }
    }

    nextBtn.addEventListener("click", nextQuestion);

    // Initialize quiz
    loadQuestion();
  </script>
</body>
</html>
